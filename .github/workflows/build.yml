name: Build Data Lake Variance Table

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:ci
      - run: npx tsc --noEmit -p .
      - run: npx pbiviz package
      - name: Upload Power BI package
        uses: actions/upload-artifact@v4
        with:
          name: data-lake-variance-table-pbiviz
          path: dist/*.pbiviz
          if-no-files-found: error
          retention-days: 30
